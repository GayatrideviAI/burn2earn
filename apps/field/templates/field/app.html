{% load static i18n %}{% get_current_language as LANGUAGE_CODE %}<!doctype html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f6b3a">
  <title>Mitra app · Regenerix</title>
  <link rel="manifest" href="{% url 'field:manifest' %}">
  <link rel="icon" href="{% static 'field/icon.svg' %}">
  <link rel="stylesheet" href="{% static 'field/app.css' %}">
</head>
<body>
<header class="bar">
  <a class="brand" href="#/">Regenerix</a>
  <span id="langs" class="langs"></span>
  <span id="net" class="net">…</span>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs"></nav>
<script>
  window.MITRA = {
    bootstrapUrl: "{% url 'field:api_bootstrap' %}",
    syncUrl: "{% url 'field:api_sync' %}",
    photosUrl: "{% url 'field:api_photos' %}",
    swUrl: "{% url 'field:service_worker' %}",
    loginUrl: "{% url 'field:login' %}",
    onlineUrl: "{% url 'field:dashboard' %}",
    serverLanguage: "{{ LANGUAGE_CODE }}",
    languages: [["en", "English"], ["hi", "हिन्दी"], ["pa", "ਪੰਜਾਬੀ"]],
    catalog: {{ catalog_json|safe }}
  };
</script>
<script src="{% static 'weightphotos/photos.js' %}"></script>
<script src="{% static 'field/app.js' %}"></script>
</body>
</html>
