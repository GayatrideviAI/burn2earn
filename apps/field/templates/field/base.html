{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mitra{% endblock %} · Regenerix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'field/field.css' %}">
</head>
<body>
<header class="bar">
  <a class="brand" href="{% url 'field:dashboard' %}"><img src="{% static 'field/images/logo.png' %}" alt="" onerror="this.remove()"><span>Regenerix</span></a>
  {% if user.is_authenticated %}
  <nav>
    <a href="{% url 'field:farmer_list' %}">Farmers</a>
    <a href="{% url 'field:stock' %}">Stock</a>
    <a href="{% url 'field:dispatch_list' %}">Dispatch</a>
    <form method="post" action="{% url 'field:logout' %}">{% csrf_token %}<button class="link">Log out</button></form>
  </nav>
  {% endif %}
</header>
{% block hero %}{% endblock %}
<main>
  {% for message in messages %}<p class="msg {{ message.tags }}">{{ message }}</p>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
