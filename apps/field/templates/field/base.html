{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mitra{% endblock %} · Regenerix</title>
  <link rel="stylesheet" href="{% static 'field/field.css' %}">
</head>
<body>
<header class="bar">
  <a class="brand" href="{% url 'field:dashboard' %}">Regenerix</a>
  {% if user.is_authenticated %}
  <nav>
    <a href="{% url 'field:farmer_list' %}">Farmers</a>
    <form method="post" action="{% url 'field:logout' %}">{% csrf_token %}<button class="link">Log out</button></form>
  </nav>
  {% endif %}
</header>
<main>
  {% for message in messages %}<p class="msg {{ message.tags }}">{{ message }}</p>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
