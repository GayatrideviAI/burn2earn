{% extends "field/base.html" %}
{% block title %}Log a pickup{% endblock %}
{% block content %}
<div class="panel">
<h1>Log a pickup from {{ farmer.name }}</h1>
<form method="post">{% csrf_token %}
  {% include "field/form_fields.html" %}
  <button class="primary">Save pickup</button>
  <a class="button" href="{% url 'field:farmer_detail' farmer.pk %}">Cancel</a>
</form>
</div>
{% endblock %}
