{% extends "field/base.html" %}
{% block title %}New dispatch{% endblock %}
{% block content %}
<div class="panel">
<h1>Send product to a buyer</h1>
<p class="muted">Only product you have reported as made and not already sent can be dispatched.</p>
<form method="post">{% csrf_token %}
  {% include "field/form_fields.html" %}
  <button class="primary">Create dispatch</button>
  <a class="button" href="{% url 'field:dispatch_list' %}">Cancel</a>
</form>
</div>
{% endblock %}
