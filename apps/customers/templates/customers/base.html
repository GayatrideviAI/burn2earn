{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Stock{% endblock %} · Regenerix</title>
  <link rel="stylesheet" href="{% static 'customers/customers.css' %}">
</head>
<body>
<header class="bar">
  <a class="brand" href="{% url 'customers:dashboard' %}">Regenerix</a>
  {% if user.is_authenticated %}
  <span class="who">{{ buyer.company_name }}</span>
  <form method="post" action="{% url 'customers:logout' %}">{% csrf_token %}<button class="link">Log out</button></form>
  {% endif %}
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
