services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: burn2earn
      POSTGRES_USER: burn2earn
      POSTGRES_PASSWORD: burn2earn
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U burn2earn -d burn2earn"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      POSTGRES_DB: burn2earn
      POSTGRES_USER: burn2earn
      POSTGRES_PASSWORD: burn2earn
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
