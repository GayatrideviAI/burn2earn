name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: burn2earn
          POSTGRES_USER: burn2earn
          POSTGRES_PASSWORD: burn2earn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U burn2earn -d burn2earn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DB: burn2earn
      POSTGRES_USER: burn2earn
      POSTGRES_PASSWORD: burn2earn
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install GDAL, GEOS and PROJ
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils libproj-dev gdal-bin libgdal-dev
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: |
          set -o pipefail
          python manage.py test --noinput 2>&1 | tee test-output.txt || {
            python - <<'PY'
          text = open("test-output.txt").read()
          blocks = [b.strip().splitlines() for b in text.split("=" * 70) if b.strip().startswith(("ERROR:", "FAIL:"))]
          body = "\n\n".join("\n".join(b[:1] + ["..."] + b[-8:]) for b in blocks)[:6000] or text[-3000:]
          print("::error title=Test failures::" + body.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PY
            exit 1
          }
